name: LeadVise Google Maps Scraper
on:
  workflow_dispatch:
    inputs:
      max_urls:
        description: Maximum grid URLs to process
        required: false
        default: "10"
  schedule:
       - cron: '34 11 * * *'
       - cron: '34 14 * * *'
concurrency:
  group: leadvise-scraper
  cancel-in-progress: false
jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Claim URLs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          MAX_URLS: ${{ inputs.max_urls || '10' }}
        run: python scripts/claim_urls.py
      - name: Check queue
        id: queue
        run: echo "has_batch=$(python -c 'import json; print(bool(json.load(open("claimed.json")).get("batch_id")))')" >> "$GITHUB_OUTPUT"

      - name: Run gosom
        if: steps.queue.outputs.has_batch == 'True'
        run: |
          set +e
          mkdir -p out
          docker pull gosom/google-maps-scraper:latest
          # Diagnostic only: record the exact image used for this run.
          docker image inspect gosom/google-maps-scraper:latest --format 'Gosom image ID: {{.Id}} | RepoDigests: {{json .RepoDigests}}'

          container_name="gosom-${GITHUB_RUN_ID}"
          docker create \
            --name "$container_name" \
            -v "$PWD/queries.txt:/queries.txt:ro" \
            -v "$PWD/out:/out" \
            gosom/google-maps-scraper:latest \
            -input /queries.txt \
            -results /out/results.json \
            -json \
            -depth 10 \
            -c 4 \
            -exit-on-inactivity 3m

          docker start "$container_name" >/dev/null

          # Capture logs to a file so the shutdown watchdog can detect the
          # Scrapemate completion marker without depending on console output.
          docker logs -f "$container_name" > gosom_container.log 2>&1 &
          logs_pid=$!

          # Scrapemate has occasionally logged that it exited while the
          # container's main process remained alive. Give normal shutdown
          # 60 seconds, then stop the container so partial results can ingest.
          (
            while docker inspect -f '{{.State.Running}}' "$container_name" 2>/dev/null | grep -q '^true$'; do
              if grep -Fq 'scrapemate exited' gosom_container.log 2>/dev/null; then
                echo "Scrapemate exit marker detected; allowing 60 seconds for normal container shutdown."
                sleep 60
                if docker inspect -f '{{.State.Running}}' "$container_name" 2>/dev/null | grep -q '^true$'; then
                  echo "Shutdown watchdog: container still running after 60-second grace period; stopping it."
                  touch gosom_shutdown_watchdog_triggered
                  docker stop -t 10 "$container_name" >/dev/null 2>&1 || docker kill "$container_name" >/dev/null 2>&1 || true
                fi
                exit 0
              fi
              sleep 5
            done
          ) &
          watchdog_pid=$!

          timeout --foreground --signal=TERM --kill-after=30s 30m \
            docker wait "$container_name" > gosom_container_exit.txt
          wait_status=$?

          kill "$watchdog_pid" 2>/dev/null || true
          wait "$watchdog_pid" 2>/dev/null || true
          kill "$logs_pid" 2>/dev/null || true
          wait "$logs_pid" 2>/dev/null || true

          timed_out=false
          if [ -f gosom_shutdown_watchdog_triggered ]; then
            timed_out=true
            echo "Gosom shutdown watchdog stopped a container that stayed alive after Scrapemate exited."
            gosom_exit=124
          elif [ "$wait_status" -eq 124 ]; then
            timed_out=true
            echo "Gosom hit the 30-minute process timeout. Stopping container."
            docker stop -t 10 "$container_name" >/dev/null 2>&1 || \
              docker kill "$container_name" >/dev/null 2>&1 || true
            gosom_exit=124
          elif [ -s gosom_container_exit.txt ]; then
            gosom_exit=$(tr -d '\r\n' < gosom_container_exit.txt)
          else
            gosom_exit="$wait_status"
          fi

          if [ -s out/results.json ]; then
            cp out/results.json results.json
            echo "Scraper output found: $(wc -c < out/results.json) bytes"
          else
            echo "No scraper results.json was produced."
          fi

          docker rm -f "$container_name" >/dev/null 2>&1 || true

          cat > gosom_status.json <<EOF
          {
            "exit_code": $gosom_exit,
            "timed_out": $timed_out,
            "shutdown_watchdog_triggered": $([ -f gosom_shutdown_watchdog_triggered ] && echo true || echo false),
            "result_file_present": $([ -s results.json ] && echo true || echo false)
          }
          EOF

          echo "Gosom exit code: $gosom_exit | timed_out=$timed_out | shutdown_watchdog_triggered=$([ -f gosom_shutdown_watchdog_triggered ] && echo true || echo false)"
          # Keep the workflow moving so partial results can still be ingested.
          exit 0

      - name: Verify Gosom completion
        if: steps.queue.outputs.has_batch == 'True'
        run: python scripts/verify_gosom_completion.py

      - name: Ingest
        if: steps.queue.outputs.has_batch == 'True'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/ingest.py

      - name: Finalize
        if: always() && steps.queue.outputs.has_batch == 'True'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RUN_STATUS: ${{ job.status }}
          FAILURE_REASON: "Gosom timed out or failed, or another scraper step failed. Check gosom_status.json and step logs."
        run: python scripts/finalize.py

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scraper-run
          path: |
            results.json
            out/results.json
            ingest_stats.json
            claimed.json
            gosom_status.json
            gosom_container_exit.txt
            gosom_container.log
          retention-days: 7
          if-no-files-found: ignore
